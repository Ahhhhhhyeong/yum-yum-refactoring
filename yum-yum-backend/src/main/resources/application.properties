spring.application.name=yum-yum-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/yum-yum
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 기존 테이블을 검사하며 자동 생성/변경하지 않습니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 현재 제공 중인 약관 문서의 버전과 함께 관리합니다.
signup.terms-version=2026-10-05
